<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management Service</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>HOSPITAL</h1>
        <p>Patient Login</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="mobile">Patient ID</label>
                <input type="text" id="mobile" name="mobile" placeholder="01 *******" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>
            
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">Login</button>
        </form>
        
        <!-- Role Selection Section -->
        <div class="role-section">
            <p>Logging in as a different role?</p>
            <div class="role-links">
                <a href="/doctor-login" class="role-link">Doctor Login</a>
                <span class="separator">|</span>
                <a href="/admin-login" class="role-link">Admin Login</a>
            </div>
        </div>
        
        <div class="create-account">
            <a href="#" id="createAccountLink">Create Account</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
